name: pr-title-lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-title-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "${PR_TITLE:-}" ]; then
            echo "PR title is empty."
            exit 1
          fi

          pattern='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9_-]*\))?!?: [a-z0-9].+$'

          if ! printf '%s\n' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "PR title must be Conventional Commit style."
            echo "Expected: type(scope): subject"
            echo "Example: feat(cli): bootstrap ask command surface"
            echo "Because PRs merge by squash, this becomes final commit subject."
            exit 1
          fi

          echo "PR title looks good."
