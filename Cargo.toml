[package]
name = "cowork"
version = "0.1.0"
description = "Local CLI for coding agents."
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/aidan46/cowork"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
dbg_macro = "deny"
doc_markdown = "deny"
expect_used = "deny"
missing_docs_in_private_items = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
must_use_candidate = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
use_self = "deny"
wildcard_imports = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
